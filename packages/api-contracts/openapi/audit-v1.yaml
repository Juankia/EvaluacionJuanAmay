openapi: 3.0.3
info:
  title: Audit Service — read API
  version: 1.0.0
  description: >
    Local persistence with a per-source hash chain to DETECT accidental modification.
    It is NOT tamper-resistant storage and does NOT satisfy regulatory retention
    (WORM storage and retention policies are pending, docs/implementacion/05).
paths:
  /audit/v1/events:
    get:
      operationId: searchAuditEvents
      parameters:
        - {name: subjectId, in: query, required: true, schema: {type: string, maxLength: 64}}
        - {name: category, in: query, required: false, schema: {type: string, enum: [A1, A2, A3, A4, A5, A6, A7, A8]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Matching audit records (the query itself is audited as A6)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditRecord'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
components:
  responses:
    Error:
      description: Uniform error
      content:
        application/json:
          schema: {$ref: './common-v1.yaml#/components/schemas/ErrorResponse'}
  schemas:
    AuditRecord:
      type: object
      required: [eventId, eventType, source, subjectId, auditCategory, occurredAt, recordedAt, chainHash]
      properties:
        eventId: {type: string}
        eventType: {type: string}
        source: {type: string}
        subjectId: {type: string}
        auditCategory: {type: string}
        occurredAt: {type: string, format: date-time}
        recordedAt: {type: string, format: date-time}
        sequenceGap: {type: boolean}
        chainHash: {type: string}
