quarkus.application.name=digital-linking-service
quarkus.http.port=8082
quarkus.http.test-port=0
quarkus.banner.enabled=false

# Persistence (credentials come from the environment; see infra/local/.env.example)
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${LINKING_DB_URL}
%prod.quarkus.datasource.username=${LINKING_DB_USER}
%prod.quarkus.datasource.password=${LINKING_DB_PASSWORD}
quarkus.flyway.migrate-at-start=true

# Keyed digests of identifications and request fingerprints. Production custody is PF4-05.
%prod.linking.digest-key=${LINKING_DIGEST_KEY}
%dev,test.linking.digest-key=local-only-digest-key-not-a-secret-000000

# Outbox relay to the domain-events exchange (ADR-0015). Routing key = event type.
%prod.rabbitmq-host=${RABBITMQ_HOST:localhost}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USER}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD}
quarkus.rabbitmq.devservices.image-name=rabbitmq:4.1-management
mp.messaging.outgoing.domain-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.domain-events.exchange.name=domain-events
mp.messaging.outgoing.domain-events.exchange.type=topic
mp.messaging.outgoing.domain-events.publish-confirms=true
linking.outbox.interval=2s
%test.linking.outbox.interval=200ms
linking.outbox.initial-delay=3s
linking.outbox.batch-size=100
linking.outbox.publish-timeout=PT5S

# MOCK KYC provider: capture references with these prefixes are rejected, fail or answer late
linking.mock-kyc.rejected-prefixes=reject-
linking.mock-kyc.unavailable-prefixes=unavailable-
linking.mock-kyc.slow-prefixes=slow-
linking.mock-kyc.slow-millis=5000
%test.linking.mock-kyc.slow-millis=1500
%test.ec.digitalbanking.linking.adapters.out.kyc.MockIdentityVerificationProvider/verify/Timeout/value=300

# Observability
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field.service.value=digital-linking-service
quarkus.micrometer.export.prometheus.path=/q/metrics

# Test-only channel: observes what the relay publishes
%test.mp.messaging.incoming.test-observer.connector=smallrye-rabbitmq
%test.mp.messaging.incoming.test-observer.exchange.name=domain-events
%test.mp.messaging.incoming.test-observer.exchange.type=topic
%test.mp.messaging.incoming.test-observer.queue.name=linking.test.observer
%test.mp.messaging.incoming.test-observer.routing-keys=OnboardingStatusChanged
