quarkus.application.name=notifications-service
quarkus.http.port=8083
quarkus.http.test-port=0
quarkus.banner.enabled=false

quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${NOTIFICATIONS_DB_URL}
%prod.quarkus.datasource.username=${NOTIFICATIONS_DB_USER}
%prod.quarkus.datasource.password=${NOTIFICATIONS_DB_PASSWORD}
quarkus.flyway.migrate-at-start=true

%prod.rabbitmq-host=${RABBITMQ_HOST:localhost}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USER}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD}
quarkus.rabbitmq.devservices.image-name=rabbitmq:4.1-management
mp.messaging.incoming.notification-events.connector=smallrye-rabbitmq
mp.messaging.incoming.notification-events.exchange.name=domain-events
mp.messaging.incoming.notification-events.exchange.type=topic
mp.messaging.incoming.notification-events.queue.name=notifications.events
mp.messaging.incoming.notification-events.routing-keys=OnboardingStatusChanged
mp.messaging.incoming.notification-events.auto-bind-dlq=true
mp.messaging.incoming.notification-events.dlx.declare=true
mp.messaging.incoming.notification-events.dead-letter-exchange=domain-events.dlx
mp.messaging.incoming.notification-events.dead-letter-queue-name=notifications.events.dlq
mp.messaging.incoming.notification-events.failure-strategy=reject

# Bounded retry per channel (MAX_INTENTOS_CONSUMO is PF4-02; these are provisional values)
notifications.channel.max-attempts=3
notifications.channel.backoff-millis=200
%test.notifications.channel.backoff-millis=10

# FAKE providers: subjects with these prefixes fail deliberately (local fault injection)
notifications.fake.push.failing-subject-prefixes=fail-push-,fail-all-
notifications.fake.sms.failing-subject-prefixes=fail-all-

quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field.service.value=notifications-service
quarkus.micrometer.export.prometheus.path=/q/metrics

%test.mp.messaging.outgoing.test-publisher.connector=smallrye-rabbitmq
%test.mp.messaging.outgoing.test-publisher.exchange.name=domain-events
%test.mp.messaging.outgoing.test-publisher.exchange.type=topic
%test.mp.messaging.outgoing.test-publisher.default-routing-key=OnboardingStatusChanged
