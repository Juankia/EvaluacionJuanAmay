quarkus.application.name=audit-service
quarkus.http.port=8084
quarkus.http.test-port=0
quarkus.banner.enabled=false

# Persistence (credentials come from the environment; see infra/local/.env.example)
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${AUDIT_DB_URL}
%prod.quarkus.datasource.username=${AUDIT_DB_USER}
%prod.quarkus.datasource.password=${AUDIT_DB_PASSWORD}
quarkus.flyway.migrate-at-start=true

# Messaging: one queue bound to every domain event, with a dead-letter queue
%prod.rabbitmq-host=${RABBITMQ_HOST:localhost}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USER}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD}
mp.messaging.incoming.audit-events.connector=smallrye-rabbitmq
mp.messaging.incoming.audit-events.exchange.name=domain-events
mp.messaging.incoming.audit-events.exchange.type=topic
mp.messaging.incoming.audit-events.queue.name=audit.events
mp.messaging.incoming.audit-events.routing-keys=#
mp.messaging.incoming.audit-events.auto-bind-dlq=true
mp.messaging.incoming.audit-events.dlx.declare=true
mp.messaging.incoming.audit-events.dead-letter-exchange=domain-events.dlx
mp.messaging.incoming.audit-events.dead-letter-queue-name=audit.events.dlq
mp.messaging.incoming.audit-events.failure-strategy=reject
audit.consumer.max-attempts=3

# Read API: role "auditor" issued by the corporate IdP (not available locally; see docs/implementacion/05)
%prod.mp.jwt.verify.issuer=${AUDIT_JWT_ISSUER}
%prod.mp.jwt.verify.publickey.location=${AUDIT_JWT_PUBLIC_KEY_LOCATION}
%dev,test.mp.jwt.verify.issuer=https://corporate-idp.invalid
%dev,test.mp.jwt.verify.publickey.location=test-keys/public.pem
mp.jwt.verify.audiences=audit
smallrye.jwt.path.groups=groups

# Observability
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field.service.value=audit-service
quarkus.micrometer.export.prometheus.path=/q/metrics

# Test-only channels: publish to the exchange and observe the dead-letter queue
%test.mp.messaging.outgoing.test-publisher.connector=smallrye-rabbitmq
%test.mp.messaging.outgoing.test-publisher.exchange.name=domain-events
%test.mp.messaging.outgoing.test-publisher.exchange.type=topic
%test.mp.messaging.outgoing.test-publisher.default-routing-key=test.event
quarkus.rabbitmq.devservices.image-name=rabbitmq:4.1-management
